<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nown S.I.T.E.S — Content Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="../src/css/nown-plate.css" />
  <link rel="stylesheet" href="../src/css/nown-tiles.css" />
  <script src="../src/js/sites-theme.js"></script>
  <style>
    /* Admin chrome only — token-driven. Tiles themselves carry no inline styles. */
    .adm-shell { max-width: 1100px; margin-inline: auto; padding: var(--space-8) var(--space-6); }
    .adm-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
    .adm-card { background: var(--color-surface); border: 1px solid var(--color-surface-2); border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-card); }
    .adm-grid { display: grid; grid-template-columns: minmax(220px, 280px) 1fr; gap: var(--space-6); align-items: start; }
    @media (max-width: 760px) { .adm-grid { grid-template-columns: 1fr; } }
    .adm-side { display: grid; gap: var(--space-2); }
    .adm-side h3 { margin: 0 0 var(--space-2); font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; color: var(--color-text-muted); }
    .adm-item { text-align: left; display: grid; gap: 2px; padding: var(--space-3); border: 1px solid var(--color-surface-2); border-radius: var(--radius-md); background: var(--color-background); color: var(--color-text); cursor: pointer; }
    .adm-item.active { border-color: var(--color-accent); box-shadow: inset 3px 0 0 var(--color-accent); }
    .adm-item small { color: var(--color-text-muted); }
    .adm-editor { display: grid; gap: var(--space-4); }
    .adm-editor h2 { margin: 0; }
    .adm-hint { margin: 0; color: var(--color-text-muted); font-size: .85rem; }
    .adm-group { margin: var(--space-6) 0 var(--space-1); font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--color-text-muted); border-bottom: 1px solid var(--color-surface-2); padding-bottom: var(--space-1); }
    .adm-group:first-child { margin-top: 0; }
    .adm-field { display: grid; gap: var(--space-1); font-weight: 600; font-size: .85rem; }
    .adm-field input, .adm-field textarea, .adm-field select { font: inherit; font-weight: 400; padding: var(--space-3); border: 1px solid var(--color-surface-2); border-radius: var(--radius-md); background: var(--color-background); color: var(--color-text); width: 100%; }
    .adm-rows { display: grid; gap: var(--space-3); }
    .adm-row { display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px dashed var(--color-surface-2); border-radius: var(--radius-md); position: relative; }
    .adm-sub { display: grid; gap: var(--space-1); font-size: .8rem; font-weight: 600; }
    .adm-subrow { display: grid; gap: var(--space-2); grid-template-columns: 1fr 1fr; }
    .adm-del { position: absolute; top: var(--space-2); right: var(--space-2); border: 1px solid var(--color-surface-2); background: var(--color-background); border-radius: var(--radius-sm); cursor: pointer; }
    .adm-add { justify-self: start; border: 1px solid var(--color-primary); background: transparent; color: var(--color-primary); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); cursor: pointer; font-weight: 600; }
    .adm-bar { display: flex; align-items: center; gap: var(--space-4); margin-top: var(--space-6); }
    .adm-status { color: var(--color-text-muted); font-size: .9rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body data-content="nowndigital.content.json">
  <div class="sites-plate">
    <div class="plate-ambient" aria-hidden="true"></div>

    <div class="site-header">
      <nav class="nav-dock" aria-label="Admin">
        <a class="nav-dock-link" href="../README.md"><span>Docs</span></a>
        <a class="nav-dock-link" href="prototype-template.html"><span>Site</span></a>
        <button class="nav-dock-link nav-dock-theme" data-role="theme-toggle" type="button" aria-label="Toggle dark mode"><span>Theme</span></button>
      </nav>
    </div>

    <main class="adm-shell">
      <div class="adm-top">
        <div>
          <h1>Content Admin</h1>
          <p class="adm-hint">Edit the copy; the structure and CSS are predefined. Changes write to the backend copy file (<code>content.json</code>).</p>
        </div>
      </div>

      <!-- Login gate -->
      <section id="loginCard" class="adm-card" data-tile="admin-login">
        <h2>Sign in</h2>
        <p class="adm-hint" id="loginHint">Adapter: <strong id="adapterName">local</strong> — local authoring needs no password.</p>
        <form id="loginForm" class="tile-contact-form" autocomplete="on">
          <label>Email <input type="email" name="email" value="hello@example.com" /></label>
          <label>Password <input type="password" name="password" placeholder="••••••••" /></label>
          <button class="btn btn-tactile btn-gold-tactile" type="submit">Sign in</button>
        </form>
      </section>

      <!-- Dashboard -->
      <section id="dashboard" hidden>
        <div class="adm-card">
          <div id="adminRoot"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../src/js/tile-registry.js"></script>
  <script src="../src/js/sites-assets.js"></script>
  <script src="../src/js/sites-content.js"></script>
  <script src="../src/js/sites-adapters.js"></script>
  <script src="../src/js/sites-admin.js"></script>
  <!-- Provider selection (Firebase by default; local/git/http supported) -->
  <script src="sites.config.js"></script>
  <script>
  (function () {
    // Theme (mode + light/dark switching) is handled by sites-theme.js.

    // ---- adapter selection: driven by sites.config.js (Firebase by default) ----
    var cfg = window.SITES_CONFIG || { adapter: 'local', options: { url: 'nowndigital.content.json' } };
    var adapter = SITES.contentAdapterFor(cfg.adapter, cfg.options);
    var siteId = cfg.siteId || 'nowndigital';
    document.getElementById('adapterName').textContent = adapter.name;
    if (cfg.adapter === 'firebase' && !window.firebase) {
      document.getElementById('loginHint').textContent =
        'Firebase adapter selected — add the Firebase SDK <script> tags to this page (auth + storage).';
    }

    // ---- asset deployment mode (repo | firebase) ----
    var assetCfg = cfg.assets || { adapter: 'repo' };
    SITES.assets.setAdapter(assetCfg.adapter, assetCfg.options || {});

    var doc = null;

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var fd = new FormData(e.target);
      try {
        await adapter.login(fd.get('email'), fd.get('password'));
      } catch (err) { document.getElementById('loginHint').textContent = 'Sign-in failed: ' + err.message; return; }

      try {
        doc = await adapter.load(siteId);
      } catch (err) {
        document.getElementById('loginHint').textContent = 'Could not load the copy file: ' + err.message +
          ' (serve this folder over HTTP, e.g. `python3 -m http.server`).';
        return;
      }
      document.getElementById('loginCard').hidden = true;
      document.getElementById('dashboard').hidden = false;
      SITES.admin.mount({ root: document.getElementById('adminRoot'), adapter: adapter, content: doc });
    });
  })();
  </script>
</body>
</html>
