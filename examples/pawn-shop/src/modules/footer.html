<!-- footer tile — brand, a row of links, legal line.
     The links are config, not markup: a snippet that hardcodes example hrefs
     publishes them on every site built from it, and /work, /privacy and /terms
     do not exist on most of them. -->
<footer class="tile-footer sites-container" data-tile="footer" data-tile-id="footer-1">
  <div>
    <div class="tile-footer__brand" data-role="brand">Your site</div>
    <p data-role="tagline">Built with the Nown S.I.T.E.S framework.</p>
  </div>
  <nav class="tile-footer__cols" data-role="links" aria-label="Footer">
        <!-- placeholder: replaced when items are supplied -->
    <a class="tile-footer__link" data-role="action" href="/">Home</a>

    <template><a class="tile-footer__link" data-role="action" href=""><span data-role="label"></span></a></template>
  </nav>
  <div class="tile-footer__legal" data-role="legal">
    <span data-role="copyright">© 2026</span>
  </div>
</footer>
