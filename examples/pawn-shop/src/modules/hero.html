<!-- hero tile — opening band: headline, one sentence, buttons, optional visual.
     The tile root is the CONTAINER; .tile-hero__grid is what reflows, because a
     container query can never match its own element. -->
<section class="tile tile-hero" data-tile="hero" data-tile-id="hero-1">
  <div class="tile-hero__grid">
    <div class="tile-hero__content">
      <h1 data-role="headline">Your headline goes here</h1>
      <p data-role="body">One sentence that explains what this is.</p>
      <div class="tile-hero__actions" data-role="actions">
                <!-- placeholder: replaced when items are supplied -->
        <a class="btn btn-tactile btn-gold-tactile" data-role="action"><span data-role="label">Get started</span></a>

        <template><a class="btn btn-tactile btn-gold-tactile" data-role="action"><span data-role="label"></span></a></template>
      </div>
    </div>
    <figure class="media media--4x3" data-role="media">
      <img data-role="src" src="" alt="" />
    </figure>
  </div>
</section>
