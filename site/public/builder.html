  <style>
    /* Builder chrome only — token-driven, like the admin's .adm-* chrome. The
       assembled site is rendered in the preview iframe by the real runtime; this
       page holds no tile markup. The two-column rows use the auto-fit grid, so
       there is no layout media query. */
    .adm-shell { max-width: 1560px; margin-inline: auto; padding: var(--space-6) var(--space-6) var(--space-16); }
    .adm-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
    .adm-card { background: var(--color-surface); border: 1px solid var(--color-surface-2); border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-card); }
    .adm-card h2:first-child { margin-top: 0; }
    .adm-hint { margin: 0; color: var(--color-text-muted); font-size: .85rem; }
    .adm-group { margin: var(--space-6) 0 var(--space-1); font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--color-text-muted); border-bottom: 1px solid var(--color-surface-2); padding-bottom: var(--space-1); }
    .adm-group:first-child { margin-top: 0; }
    .adm-field { display: grid; gap: var(--space-1); font-weight: 600; font-size: .85rem; }
    .adm-field input, .adm-field textarea, .adm-field select { font: inherit; font-weight: 400; padding: var(--space-3); border: 1px solid var(--color-surface-2); border-radius: var(--radius-md); background: var(--color-background); color: var(--color-text); width: 100%; }
    .adm-item { text-align: left; display: grid; gap: 2px; padding: var(--space-3); border: 1px solid var(--color-surface-2); border-radius: var(--radius-md); background: var(--color-background); color: var(--color-text); cursor: pointer; }
    .adm-item small { color: var(--color-text-muted); }
    .adm-rows { display: grid; gap: var(--space-3); }
    .adm-row { display: grid; gap: var(--space-2); padding: var(--space-3); border: 1px dashed var(--color-surface-2); border-radius: var(--radius-md); position: relative; }
    .adm-sub { display: grid; gap: var(--space-1); font-size: .8rem; font-weight: 600; }
    .adm-subrow { display: grid; gap: var(--space-2); grid-template-columns: 1fr 1fr; }
    .adm-del { position: absolute; top: var(--space-2); right: var(--space-2); border: 1px solid var(--color-surface-2); background: var(--color-background); border-radius: var(--radius-sm); cursor: pointer; }
    .adm-add { justify-self: start; border: 1px solid var(--color-primary); background: transparent; color: var(--color-primary); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); cursor: pointer; font-weight: 600; }
    .adm-bar { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-6); }
    .adm-status { margin: 0; color: var(--color-text-muted); font-size: .9rem; }

    .bld-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: var(--space-6); align-items: start; margin-bottom: var(--space-6); }

    /* Sticky export toolbar — the way out is always in reach. */
    .bld-toolbar {
      position: sticky; top: 0; z-index: 6;
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;
      padding: var(--space-3) var(--space-4); margin-bottom: var(--space-5);
      background: var(--color-dock); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--color-dock-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    }
    .bld-toolbar__actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
    .bld-toolbar__status { display: flex; gap: var(--space-4); align-items: center; }

    /* Three columns: pick · configure · watch. The preview column sticks so you
       can see the result while editing, instead of scrolling 2400px to look. */
    /* Library · Preview · Inspector. The preview gets the largest share: it is the
       work, and its scale-to-fit means more width is directly more legible page. */
    /* Library · Preview · Inspector. The preview takes the largest share, and it
       needs to: it now renders at the width it is shown at, and the framework's wide
       tier begins at 48rem (768px). At 1600px with the old 1.9fr the column was
       760px — eight pixels short — so the desktop layout could not be previewed at
       all. 2.4fr puts it near 875px at the same window size. */
    .bld-cols { display: grid; grid-template-columns: minmax(190px, 228px) minmax(380px, 2.4fr) minmax(330px, 1fr); gap: var(--space-5); align-items: start; }
    .bld-col { display: grid; gap: var(--space-5); align-content: start; min-width: 0; }
    .bld-col--view { position: sticky; top: 4.75rem; }
    .bld-col--view .adm-card { display: grid; }
    .bld-preview { height: min(78vh, 900px); }

    /* Below ~1400px three columns stop being usable, so the preview moves to its
       own full-width row under the library and the inspector. */
    @media (max-width: 1400px) {
      .bld-cols { grid-template-columns: minmax(200px, 260px) minmax(340px, 1fr); }
      .bld-col--view { grid-column: 1 / -1; order: -1; position: static; }
      .bld-preview-wrap { max-width: 100%; }
    }
    @media (max-width: 780px) { .bld-cols { grid-template-columns: 1fr; } .bld-col--view { order: 0; } }

    /* Picker: a filter box over grouped tile buttons. */
    .bld-picker-wrap { display: grid; gap: var(--space-3); }
    .bld-filter { font: inherit; padding: var(--space-2) var(--space-3); border: 1px solid var(--color-surface-2); border-radius: var(--radius-md); background: var(--color-background); color: var(--color-text); position: sticky; top: 4.75rem; z-index: 2; }
    .bld-picker { max-height: none; }
    .bld-panel { display: grid; gap: var(--space-3); }
    .bld-picker { display: grid; gap: var(--space-2); }
    .bld-list { display: grid; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
    .bld-row { display: flex; align-items: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); border: 1px solid var(--color-surface-2); border-radius: var(--radius-md); background: var(--color-background); }
    .bld-row.active { border-color: var(--color-accent); box-shadow: inset 3px 0 0 var(--color-accent); }
    .bld-name { flex: 1; display: grid; gap: 2px; text-align: left; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: var(--space-1); }
    .bld-name small { color: var(--color-text-muted); }
    .bld-move, .bld-del { border: 1px solid var(--color-surface-2); background: var(--color-background); color: var(--color-text); border-radius: var(--radius-sm); cursor: pointer; padding: var(--space-1) var(--space-2); line-height: 1; }
    .bld-move[disabled] { opacity: .45; cursor: default; }
    .bld-fold > summary { cursor: pointer; font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--color-text-muted); border-bottom: 1px solid var(--color-surface-2); padding-bottom: var(--space-1); margin-top: var(--space-6); }
    .bld-fold > .bld-panel { margin-top: var(--space-3); }

    /* Toolbar controls: undo/redo are a pair, open/export are a pair. */
    .bld-toolgroup { display: flex; gap: var(--space-2); }
    .bld-tool {
      font: inherit; font-weight: 600; font-size: .88rem;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-surface-2); border-radius: var(--radius-md);
      background: var(--color-background); color: var(--color-text); cursor: pointer;
    }
    /* Hover is a tint, not a primary border. A border in the primary colour reads as
       "selected" at a glance, so a resting pointer on Desktop looked like Desktop was
       the active viewport while Mobile was. State and hover have to be different
       kinds of signal, not different intensities of the same one. */
    .bld-tool:hover:not([disabled]):not(.active) { background: var(--color-surface-2); }
    .bld-tool[disabled] { opacity: .45; cursor: default; }
    /* :hover is (0,3,0) — .bld-tool plus :hover plus :not([disabled]) — so it beats
       a plain .bld-tool.active at (0,2,0). Without the :hover selector here, hovering
       an active button repainted the label in the background colour and the text
       disappeared, which is exactly what a clicked viewport button does: the pointer
       is still on it afterwards. Measured, not guessed. */
    .bld-tool.active,
    .bld-tool.active:hover:not([disabled]) {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: var(--color-on-accent);
    }

    /* Picker rows: a glyph, the label, the registry's one-line description, and a
       fold-out with what the tile actually is. Adding and reading are separate
       controls — the obvious click should add a tile, not open a box. */
    .bld-pickrow { display: grid; gap: 0; }
    .bld-pickrow__main { display: flex; align-items: stretch; gap: var(--space-1); }
    .bld-pickrow__main .bld-pick { flex: 1; min-width: 0; }
    .bld-pickrow__more {
      flex: none; width: 1.9rem; font: inherit; font-size: .78rem; font-weight: 700;
      border: 1px solid var(--color-surface-2); border-radius: var(--radius-md);
      background: transparent; color: var(--color-text-muted); cursor: pointer;
    }
    .bld-pickrow__more:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .bld-pickrow__more[aria-expanded="true"] {
      background: var(--color-primary); border-color: var(--color-primary);
      color: var(--color-on-accent);
    }
    .bld-pickrow__info {
      margin: var(--space-1) 0 var(--space-3); padding: var(--space-3);
      display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-3);
      background: var(--color-surface-2); border-radius: var(--radius-md);
      font-size: .76rem; line-height: 1.45;
    }
    .bld-pickrow__info[hidden] { display: none; }
    .bld-pickrow__info dt {
      color: var(--color-text-muted); text-transform: uppercase;
      letter-spacing: .04em; font-size: .68rem; padding-top: .1rem;
    }
    .bld-pickrow__info dd { margin: 0; color: var(--color-text); overflow-wrap: anywhere; }
    .bld-pickrow__code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .72rem; }

    .bld-pick__head { display: flex; align-items: baseline; gap: var(--space-2); }
    .bld-pick__icon {
      display: inline-block; width: 1.15rem; text-align: center;
      color: var(--color-accent); font-size: 1rem; line-height: 1;
    }
    .bld-pick__about { line-height: 1.35; }

    /* The screen name is the first thing set, so it leads the toolbar. */
    .bld-screenname {
      font: inherit; font-weight: 700; font-size: 1rem;
      padding: var(--space-2) var(--space-3); width: 13rem;
      border: 1px solid var(--color-surface-2); border-radius: var(--radius-md);
      background: var(--color-background); color: var(--color-text);
    }
    .bld-screenname:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }

    /* Preview column: the frame is the focus, so it takes the middle column.
       min-width:0 on every level stops the iframe's width becoming a min-content
       contribution that grows the grid track. */
    .bld-preview-wrap { display: grid; gap: var(--space-3); min-width: 0; }
    /* The frame is rendered at the width it is shown at — no transform — so the
       scaler only needs to stop it overflowing while a resize settles. */
    .bld-frame-scaler { position: relative; height: min(74vh, 860px); overflow: hidden; min-width: 0; }
    .bld-frame-scaler .bld-preview { height: 100%; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
    .bld-viewreadout {
      margin-inline-start: auto; margin-inline-end: var(--space-3);
      font-size: .72rem; color: var(--color-text-muted);
      font-variant-numeric: tabular-nums;
    }

    /* The tile list is navigation for the whole inspector, so it sits above the tab
       strip rather than inside a tab. Capped and scrollable so a fifteen-tile page
       cannot push the tabs off the bottom. */
    .bld-order { display: grid; gap: var(--space-2); }
    .bld-order .bld-list { max-height: 15rem; overflow-y: auto; }
    .bld-viewbar-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); flex-wrap: wrap; }
    .bld-viewbar { display: flex; gap: var(--space-1); }
    .bld-viewbar .bld-tool { padding: var(--space-1) var(--space-3); font-size: .82rem; }

    /* Problems. Above the tabs rather than inside one, so a defect is visible
       whichever panel you were in when you caused it. */
    .bld-problems { display: grid; gap: var(--space-2); }
    .bld-problems[hidden] { display: none; }
    .bld-problems__head {
      display: flex; align-items: center; gap: var(--space-2); width: 100%;
      font: inherit; font-weight: 600; font-size: .85rem; text-align: left;
      padding: var(--space-2) var(--space-3);
      border: 1px solid var(--color-surface-2); border-radius: var(--radius-md);
      background: var(--color-surface); color: var(--color-text); cursor: pointer;
    }
    .bld-problems__dot {
      display: inline-grid; place-items: center; width: 1.35rem; height: 1.35rem;
      border-radius: var(--radius-full, 999px); font-size: .78rem; font-weight: 700;
      background: var(--color-surface-2); color: var(--color-text-muted);
    }
    .bld-problems__dot.is-error { background: var(--color-accent); color: var(--color-on-accent); }
    .bld-problems__toggle { margin-left: auto; color: var(--color-text-muted); font-weight: 500; }
    .bld-problems__list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-1); }
    .bld-problems__item { border-left: 3px solid var(--color-surface-2); }
    .bld-problems__item.is-error { border-left-color: var(--color-accent); }
    .bld-problems__jump {
      display: block; width: 100%; text-align: left; font: inherit; font-size: .8rem;
      line-height: 1.45; padding: var(--space-2) var(--space-3);
      border: 0; border-radius: var(--radius-sm); background: transparent;
      color: var(--color-text-muted); cursor: pointer;
    }
    .bld-problems__jump:hover { background: var(--color-surface-2); color: var(--color-text); }
    .bld-problems__item.is-error .bld-problems__jump { color: var(--color-text); }

    /* Inspector: a tab strip over one panel at a time. Four panels stacked made
       the column 2934px tall, which is why the preview column looked empty. */
    .bld-inspector { display: grid; gap: var(--space-4); }
    .bld-tabs {
      display: flex; gap: var(--space-1); flex-wrap: wrap;
      border-bottom: 1px solid var(--color-surface-2); padding-bottom: var(--space-2);
    }
    .bld-tab {
      font: inherit; font-weight: 600; font-size: .85rem;
      padding: var(--space-2) var(--space-3);
      border: 1px solid transparent; border-radius: var(--radius-md);
      background: transparent; color: var(--color-text-muted); cursor: pointer;
    }
    .bld-tab:hover { color: var(--color-text); }
    .bld-tab.active,
    .bld-tab.active:hover { background: var(--color-surface-2); color: var(--color-text); border-color: var(--color-surface-2); }
    .bld-tabbody { display: grid; gap: var(--space-3); }
    .bld-tabbody[hidden] { display: none; }

    /* Code tab: one row per line, so a line can be lit from the Content tab. Every
       colour is a token — the panel obeys the rule it will lint other CSS against. */
    .bld-code {
      margin: 0; padding: var(--space-3) 0; max-height: 26rem; overflow: auto;
      background: var(--color-surface-2); border-radius: var(--radius-md);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .78rem; line-height: 1.6;
    }
    .bld-coderow { display: flex; gap: var(--space-3); padding-inline: var(--space-3); align-items: baseline; }
    .bld-coderow.is-lit { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
    .bld-codeln {
      flex: none; width: 2.2rem; text-align: right; user-select: none;
      color: var(--color-text-muted); opacity: .6;
    }
    .bld-codetext { white-space: pre; }
    /* The annotation owns a row of its own so it can never be clipped. */
    .bld-codenoterow { display: flex; gap: var(--space-3); padding-inline: var(--space-3); }
    .bld-codenoterow.is-lit { background: color-mix(in srgb, var(--color-accent) 14%, transparent); }
    .bld-codenote {
      color: var(--color-text-muted); font-size: .72rem; font-style: italic;
      line-height: 1.5; padding-bottom: var(--space-1);
    }
    .tok-key { color: var(--color-primary); }
    .tok-str { color: color-mix(in srgb, var(--color-text) 78%, var(--color-primary)); }
    .tok-num { color: var(--color-accent); }
    .tok-lit { color: var(--color-accent); font-weight: 600; }
    .tok-punc { color: var(--color-text-muted); }

    .bld-codemode { display: flex; gap: var(--space-2); align-items: center; }
    .bld-codeedit,
    .bld-cssedit {
      width: 100%; min-height: 22rem; padding: var(--space-3);
      border: 1px solid var(--color-surface-2); border-radius: var(--radius-md);
      background: var(--color-surface-2); color: var(--color-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .78rem; line-height: 1.6; tab-size: 2; resize: vertical;
    }
    .bld-codeedit:focus,
    .bld-cssedit:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
    .bld-codemsg { margin: 0; font-size: .8rem; color: var(--color-text-muted); }

    /* The tile's own CSS block and its lint. Same visible grammar as the problems
       panel: errors carry the accent, warnings stay quiet, the all-clear is muted. */
    .bld-cssedit { min-height: 7rem; max-height: 18rem; }
    .bld-csslint { display: grid; gap: var(--space-1); }
    .bld-csslint__item {
      margin: 0; font-size: .78rem; line-height: 1.45;
      padding: var(--space-2) var(--space-3);
      border-left: 3px solid var(--color-surface-2);
      border-radius: var(--radius-sm);
      color: var(--color-text-muted);
    }
    .bld-csslint__item.is-error { border-left-color: var(--color-accent); color: var(--color-text); }
    .bld-csslint__item.is-warn { border-left-color: var(--color-primary); }
    .bld-csslint__item.is-ok { border-left-color: var(--color-primary); }
    .bld-fieldwrap { display: block; }

    /* Grid overlay, drawn INSIDE the preview document so it shares the container
       context and the column tokens with the grid it is describing. */
    .bld-grid-overlay {
      position: fixed; inset: 0; z-index: 5; pointer-events: none;
      display: grid; gap: var(--grid-gap);
      padding-inline: var(--space-6);
      grid-template-columns: repeat(var(--grid-cols), 1fr);
    }
    .bld-grid-overlay[data-cols="6"] { grid-template-columns: repeat(6, 1fr); }

    /* The draft-recovery bar. It sits above everything because it is the one
       thing on the page the author has to answer. */
    .bld-notice {
      display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
      padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4);
      background: var(--color-surface); border: 1px solid var(--color-accent);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-card); font-size: .9rem;
    }
    .bld-notice span { flex: 1; min-width: 14rem; }
    .bld-preview { width: 100%; height: 70vh; min-height: 420px; border: 1px solid var(--color-surface-2); border-radius: var(--radius-lg); background: var(--color-background); }
  </style>

<body>
  <div class="sites-plate" data-plate="ambient">
    <div class="plate-ambient" aria-hidden="true"></div>

    <div class="site-header">
      <nav class="nav-dock" aria-label="Builder">
        <a class="nav-dock-link" href="index.html"><span>Site</span></a>
        <a class="nav-dock-link" href="tiles.html"><span>Tiles</span></a>
        <a class="nav-dock-link" href="blueprint.html"><span>Blueprint</span></a>
        <a class="nav-dock-link" href="admin.html"><span>Admin</span></a>
        <button class="nav-dock-link nav-dock-theme" data-role="theme-toggle" type="button" aria-label="Toggle dark mode"><span>Theme</span></button>
      </nav>
    </div>

    <main class="adm-shell">
      <div class="adm-top">
        <div>
          <h1>Tile Builder</h1>
          <p class="adm-hint">Pick tiles, arrange them, edit the copy through the tile registry — and watch the real runtime render it. Export the same site as <code>blueprint.md</code> and <code>content.json</code>.</p>
        </div>
      </div>
