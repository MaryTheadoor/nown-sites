<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-label="Diagram: a plate holding a grid of tiles">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12283F"/><stop offset="1" stop-color="#0B0F17"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#2F6FED" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- the plate -->
  <rect x="24" y="24" width="832" height="612" rx="28" fill="url(#plate)"/>
  <rect x="24" y="24" width="832" height="612" rx="28" fill="url(#grid)"/>
  <rect x="24" y="24" width="832" height="612" rx="28" fill="none" stroke="#2F6FED" stroke-opacity="0.35" stroke-width="2"/>

  <!-- chrome tile: a floating dock -->
  <rect x="330" y="60" width="220" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.94"/>
  <circle cx="366" cy="83" r="7" fill="#2F6FED"/>
  <rect x="386" y="79" width="34" height="8" rx="4" fill="#1B3A5C" fill-opacity="0.55"/>
  <rect x="430" y="79" width="34" height="8" rx="4" fill="#1B3A5C" fill-opacity="0.35"/>
  <rect x="474" y="79" width="46" height="8" rx="4" fill="#1B3A5C" fill-opacity="0.35"/>

  <!-- tiles on the grid -->
  <rect x="72" y="146" width="360" height="150" rx="18" fill="#2F6FED"/>
  <rect x="100" y="180" width="200" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="100" y="208" width="270" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="100" y="240" width="120" height="30" rx="15" fill="#FFFFFF"/>

  <rect x="452" y="146" width="356" height="150" rx="18" fill="#7C5CFF"/>
  <rect x="480" y="186" width="180" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.9"/>
  <rect x="480" y="212" width="240" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>

  <rect x="72" y="316" width="228" height="140" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#6EA8FF" stroke-opacity="0.5"/>
  <rect x="100" y="348" width="120" height="12" rx="6" fill="#6EA8FF"/>
  <rect x="100" y="372" width="170" height="9" rx="4" fill="#6EA8FF" fill-opacity="0.55"/>

  <rect x="316" y="316" width="228" height="140" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#6EA8FF" stroke-opacity="0.5"/>
  <rect x="344" y="348" width="120" height="12" rx="6" fill="#6EA8FF"/>
  <rect x="344" y="372" width="170" height="9" rx="4" fill="#6EA8FF" fill-opacity="0.55"/>

  <rect x="560" y="316" width="248" height="140" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#6EA8FF" stroke-opacity="0.5"/>
  <rect x="588" y="348" width="140" height="12" rx="6" fill="#6EA8FF"/>
  <rect x="588" y="372" width="190" height="9" rx="4" fill="#6EA8FF" fill-opacity="0.55"/>

  <!-- footer tile -->
  <rect x="72" y="476" width="736" height="120" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#6EA8FF" stroke-opacity="0.28"/>
  <rect x="100" y="506" width="130" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.75"/>
  <rect x="100" y="534" width="240" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="620" y="506" width="160" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.4"/>
</svg>
