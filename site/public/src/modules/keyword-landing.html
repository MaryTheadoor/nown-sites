<!-- keyword-landing tile — one compact keyword per page. The tile root is the
     CONTAINER; .tile-keyword-landing__grid is what reflows, because a container
     query can never match its own element. -->
<section class="tile tile-keyword-landing" data-tile="keyword-landing" data-tile-id="keyword-landing-1">
  <div class="tile-keyword-landing__grid">
    <div class="tile-keyword-landing__content">
      <h1 data-role="headline">Sell used guitars in Denver</h1>
      <div data-role="body">
        <p>Around 400 words that answer this exact search: the sub-problem, what
           it costs to leave it, how it works, one piece of proof, one next step.</p>
      </div>
      <div class="tile-keyword-landing__actions" data-role="actions">
        <!-- placeholder: replaced when items are supplied -->
        <a class="btn btn-tactile btn-gold-tactile" data-role="action"><span data-role="label">Get a quote</span></a>

        <template><a class="btn btn-tactile btn-gold-tactile" data-role="action"><span data-role="label"></span></a></template>
      </div>
    </div>
    <figure class="tile-keyword-landing__media media media--4x3" data-role="media">
      <img class="tile-keyword-landing__img" data-role="src" src="" alt="" />
      <figcaption data-role="caption"></figcaption>
    </figure>
  </div>
  <blockquote class="tile-keyword-landing__proof" data-role="proof">
    <p data-role="quote"></p>
    <footer data-role="attribution"></footer>
  </blockquote>
</section>
