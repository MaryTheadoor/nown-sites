<!-- event / calendar tile — schedules a booking without redirecting off-site.
     Provider is configured via data-calendar-url (Cal.com / SavvyCal embed URL). -->
<div class="tile tile-event" data-tile="event" data-tile-id="event-1" data-calendar-url="https://cal.com/nowndigital/consult">
  <h3 data-role="title">Book a free consultation</h3>
  <p data-role="body">Pick a time that works for you — no account needed.</p>
  <button class="btn btn-tactile btn-gold-tactile" data-role="open-calendar" type="button">Pick a time</button>
</div>
