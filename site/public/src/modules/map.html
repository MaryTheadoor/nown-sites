<!-- map tile — privacy-first Leaflet + OpenStreetMap. Loaded lazily by map.js so
     the tile is just a container until it scrolls into view. Data attributes can
     be driven from a site manifest. -->
<div class="tile tile-map" data-tile="map" data-tile-id="map-1"
     data-center="45.6770,-111.0429" data-zoom="12" data-marker="Nown Digital">
  <div class="tile-map__canvas" data-role="canvas"></div>
</div>
