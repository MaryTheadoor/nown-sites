<!-- media tile — a single image/photo with a caption. aspect-ratio prevents CLS. -->
<figure class="tile tile-media" data-tile="media" data-tile-id="media-1">
  <div class="media media--16x9" data-role="media">
    <img src="/assets/photo.jpg" alt="Describe the image" loading="lazy" />
  </div>
  <figcaption data-role="caption">Optional caption for the photo.</figcaption>
</figure>
