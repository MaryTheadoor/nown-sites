<!-- video tile — an embed that loads only when scrolled into view.
     Its URL arrives from the content file through data-attr. -->
<div class="tile tile-video" data-tile="video" data-tile-id="video-1"
     data-role="src" data-attr="data-video-src" data-video-src="">
  <div class="media media--16x9">
    <div class="tile-video__placeholder" data-role="placeholder">▶ Play video</div>
  </div>
  <p class="tile-card__meta" data-role="caption"></p>
</div>
