<!-- feature tile — a section of value-prop cards. Each item is one card, so the
     block scales from one to as many as you have. -->
<section class="section tile tile-feature-block" data-tile="feature" data-tile-id="feature-1">
  <h2 data-role="title">Why choose us</h2>
  <div class="sites-grid" data-role="items">
        <!-- placeholder: replaced when items are supplied -->
    <article class="tile tile-feature"><h3 data-role="title">First benefit</h3><p data-role="body">A short line explaining why it matters.</p></article>

    <template>
      <article class="tile tile-feature">
        <h3 data-role="title"></h3>
        <p data-role="body"></p>
      </article>
    </template>
  </div>
  <div data-role="actions">
        <!-- placeholder: replaced when items are supplied -->
    <a class="btn btn-ghost" data-role="action"><span data-role="label">Learn more</span></a>

    <template><a class="btn btn-ghost" data-role="action"><span data-role="label"></span></a></template>
  </div>
</section>
